name: Validate catalog

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:validate
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@002d16c00bc74ebced433f0a16187c9b13451194 # v4.2.0
    with:
      install-tools: python node
      install: true
      test: true
      timeout-minutes: 10
